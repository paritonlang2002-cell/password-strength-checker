<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #111827;
        }

        .container {
            width: min(100%, 450px);
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 48px 14px 15px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4f46e5;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .strength-container {
            margin-top: 20px;
        }

        .strength-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #strengthText {
            color: #6b7280;
        }

        .strength-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        #strengthFill {
            width: 0;
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .requirements {
            margin-top: 25px;
            display: grid;
            gap: 10px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        .check {
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #e5e7eb;
            font-size: 12px;
            font-weight: bold;
        }

        .requirement.valid {
            color: #16a34a;
        }

        .requirement.valid .check {
            background: #dcfce7;
            color: #16a34a;
        }

        .message {
            min-height: 22px;
            margin-top: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Password Strength</h1>
        <p class="subtitle">Type a password to check its strength.</p>

        <div class="input-wrapper">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="off"
            >
            <button class="toggle" id="togglePassword" type="button">👁</button>
        </div>

        <div class="strength-container">
            <div class="strength-label">
                <span>Strength</span>
                <span id="strengthText">None</span>
            </div>

            <div class="strength-bar">
                <div id="strengthFill"></div>
            </div>
        </div>

        <div class="requirements">
            <div class="requirement" id="length">
                <span class="check">✓</span>
                <span>At least 8 characters</span>
            </div>

            <div class="requirement" id="uppercase">
                <span class="check">✓</span>
                <span>Contains an uppercase letter</span>
            </div>

            <div class="requirement" id="lowercase">
                <span class="check">✓</span>
                <span>Contains a lowercase letter</span>
            </div>

            <div class="requirement" id="number">
                <span class="check">✓</span>
                <span>Contains a number</span>
            </div>

            <div class="requirement" id="special">
                <span class="check">✓</span>
                <span>Contains a special character</span>
            </div>
        </div>

        <div class="message" id="message">
            Your password is checked only in this browser.
        </div>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const strengthText = document.getElementById("strengthText");
        const strengthFill = document.getElementById("strengthFill");
        const message = document.getElementById("message");

        const requirements = {
            length: document.getElementById("length"),
            uppercase: document.getElementById("uppercase"),
            lowercase: document.getElementById("lowercase"),
            number: document.getElementById("number"),
            special: document.getElementById("special")
        };

        function updateRequirement(element, valid) {
            element.classList.toggle("valid", valid);
        }

        function checkPassword() {
            const password = passwordInput.value;

            const checks = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[^A-Za-z0-9]/.test(password)
            };

            Object.keys(checks).forEach(key => {
                updateRequirement(requirements[key], checks[key]);
            });

            if (password.length === 0) {
                strengthText.textContent = "None";
                strengthText.style.color = "#6b7280";
                strengthFill.style.width = "0";
                strengthFill.style.background = "#e5e7eb";
                message.textContent =
                    "Your password is checked only in this browser.";
                return;
            }

            const score = Object.values(checks).filter(Boolean).length;

            if (score <= 2) {
                strengthText.textContent = "Weak";
                strengthText.style.color = "#dc2626";
                strengthFill.style.width = "33%";
                strengthFill.style.background = "#dc2626";
                message.textContent = "Try adding more characters and variety.";
            } else if (score <= 4) {
                strengthText.textContent = "Medium";
                strengthText.style.color = "#d97706";
                strengthFill.style.width = "66%";
                strengthFill.style.background = "#d97706";
                message.textContent = "A few more improvements could make it stronger.";
            } else {
                strengthText.textContent = "Strong";
                strengthText.style.color = "#16a34a";
                strengthFill.style.width = "100%";
                strengthFill.style.background = "#16a34a";
                message.textContent = "Good combination of password characteristics.";
            }
        }

        togglePassword.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "🙈" : "👁";
        });

        passwordInput.addEventListener("input", checkPassword);
    </script>
</body>
</html>
